<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Move — evening nudge</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#FFFFFF}a:hover{color:#D4D4D4}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: #000000; color: #FFFFFF; font-family: Inter, system-ui, sans-serif; padding: 20px 20px 24px; display: flex; flex-direction: column; gap: 16px">
  <div style="display: flex; justify-content: center; padding-top: 12px">
    <span style="display: flex; align-items: center; gap: 8px; border: 1px solid #FFFFFF; border-radius: 999px; padding: 7px 14px; font-size: 12px; font-weight: 700; letter-spacing: 1.6px; text-transform: uppercase">
      <span style="width: 7px; height: 7px; border-radius: 4px; background: #FFFFFF"></span>Move mission · 8:00 PM
    </span>
  </div>

  <section style="flex: 1; display: flex; align-items: center; justify-content: center">
    <div style="position: relative; width: 260px; height: 260px">
      <svg width="260" height="260" viewBox="0 0 260 260" role="img" aria-label="62 percent of the step goal" style="position: absolute; left: 0; top: 0">
        <circle cx="130" cy="130" r="110" fill="none" stroke="#262626" stroke-width="16"></circle>
        <circle cx="130" cy="130" r="110" fill="none" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" stroke-dasharray="428.5 691.2" transform="rotate(-90 130 130)"></circle>
      </svg>
      <div style="position: absolute; left: 0; top: 0; width: 260px; height: 260px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px">
        <span style="font-size: 56px; font-weight: 800; letter-spacing: -2.5px; font-variant-numeric: tabular-nums">3,760</span>
        <span style="font-size: 14px; color: #A3A3A3">steps to go</span>
      </div>
    </div>
  </section>

  <section style="display: flex; flex-direction: column; gap: 10px">
    <h1 style="margin: 0; font-size: 40px; line-height: 44px; font-weight: 800; letter-spacing: -1.4px">One hour left.</h1>
    <p style="margin: 0; font-size: 17px; line-height: 25px; color: #B3B3B3">A 38-minute walk finishes it. This keeps ringing until you hit 10,000. It goes quiet while you're walking.</p>
  </section>

  <a href="StepsDone.dc.html" style="height: 60px; border-radius: 30px; background: #FFFFFF; color: #0A0A0A; font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 16v-2.4C4 11.5 3 10.5 3 8c0-2.7 1.5-6 4.5-6C9.4 2 10 3.8 10 5.5c0 3.1-2 5.7-2 8.7V16a2 2 0 1 1-4 0z"></path><path d="M20 20v-2.4c0-2.1 1-3.1 1-5.6 0-2.7-1.5-6-4.5-6-1.9 0-2.5 1.8-2.5 3.5 0 3.1 2 5.7 2 8.7V20a2 2 0 1 0 4 0z"></path></svg>
    Start walking
  </a>
  <span style="text-align: center; font-size: 14px; color: #8A8A8A">Snooze isn't available on missions</span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
