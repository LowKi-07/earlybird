<helmet>

    <span aria-hidden="true" style="position: absolute; width: 320px; height: 320px; border-radius: 160px; border: 1px solid #262626"></span>

    <h1 style="margin: 0; font-size: 40px; line-height: 44px; font-weight: 800; letter-spacing: -1.4px">You're not at the office yet.</h1>

    <span style="font-size: 13px; font-weight: 700">Arrive by 9:45 for half points (+15)</span>
  </section>

  <button type="button" style="height: 60px; border: 0; border-radius: 30px; background: #FFFFFF; color: #0A0A0A; font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px">

    Open directions
  </button>
  <button type="button" style="height: 44px; border: 0; background: transparent; color: #B3B3B3; font-size: 15px; font-weight: 600">Working from home today</button>
