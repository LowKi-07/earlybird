<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Set the rules</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0A0A0A}a:hover{color:#5C5C5C}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: #F2F2F2; color: #0A0A0A; font-family: Inter, system-ui, sans-serif; padding: 20px 20px 24px; display: flex; flex-direction: column; gap: 14px">
  <header style="display: flex; align-items: center; justify-content: space-between; height: 44px">
    <button type="button" aria-label="Back" style="width: 40px; height: 40px; border: 0; border-radius: 20px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; color: #0A0A0A">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>
    </button>
    <span style="font-size: 15px; font-weight: 600">Move mission</span>
    <span style="width: 40px"></span>
  </header>

  <section style="background: #FFFFFF; border-radius: 24px; padding: 18px; display: flex; flex-direction: column; gap: 10px">
    <span style="font-size: 12px; font-weight: 700; letter-spacing: 1.6px; text-transform: uppercase; color: #5C5C5C">Goal</span>
    <div style="display: flex; align-items: center; justify-content: space-between">
      <button type="button" aria-label="Fewer steps" style="width: 44px; height: 44px; border: 1px solid #E0E0E0; border-radius: 22px; background: #FFFFFF; font-size: 22px; font-weight: 600; color: #0A0A0A">−</button>
      <span style="display: flex; flex-direction: column; align-items: center">
        <span style="font-size: 48px; font-weight: 800; letter-spacing: -2px; font-variant-numeric: tabular-nums">10,000</span>
        <span style="font-size: 13px; color: #5C5C5C">steps</span>
      </span>
      <button type="button" aria-label="More steps" style="width: 44px; height: 44px; border: 1px solid #E0E0E0; border-radius: 22px; background: #FFFFFF; font-size: 22px; font-weight: 600; color: #0A0A0A">+</button>
    </div>
  </section>

  <section style="background: #FFFFFF; border-radius: 24px; padding: 6px 18px; display: flex; flex-direction: column">
    <div style="display: flex; align-items: center; justify-content: space-between; min-height: 52px; border-bottom: 1px solid #EDEDED">
      <span style="font-size: 15px; font-weight: 600">Repeat</span>
      <span style="font-size: 15px; color: #5C5C5C">Every day</span>
    </div>
    <div style="display: flex; align-items: center; justify-content: space-between; min-height: 52px; border-bottom: 1px solid #EDEDED">
      <span style="font-size: 15px; font-weight: 600">Deadline</span>
      <span style="font-size: 15px; color: #5C5C5C">9:00 PM</span>
    </div>
    <div style="display: flex; align-items: center; justify-content: space-between; min-height: 52px">
      <span style="font-size: 15px; font-weight: 600">Proof</span>
      <span style="font-size: 15px; color: #5C5C5C">Steps counted by phone</span>
    </div>
  </section>

  <section style="background: #FFFFFF; border-radius: 24px; padding: 18px; display: flex; flex-direction: column; gap: 14px">
    <span style="font-size: 12px; font-weight: 700; letter-spacing: 1.6px; text-transform: uppercase; color: #5C5C5C">If you're behind</span>
    <div style="display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; align-items: center; gap: 12px">
        <span style="width: 10px; height: 10px; border-radius: 5px; border: 2px solid #0A0A0A; box-sizing: border-box"></span>
        <span style="flex: 1; font-size: 15px">Gentle reminder</span>
        <span style="font-size: 14px; color: #5C5C5C; font-variant-numeric: tabular-nums">6:00 PM</span>
      </div>
      <div style="display: flex; align-items: center; gap: 12px">
        <span style="width: 10px; height: 10px; border-radius: 5px; background: #5C5C5C"></span>
        <span style="flex: 1; font-size: 15px">Firm nudge</span>
        <span style="font-size: 14px; color: #5C5C5C; font-variant-numeric: tabular-nums">7:30 PM</span>
      </div>
      <div style="display: flex; align-items: center; gap: 12px">
        <span style="width: 10px; height: 10px; border-radius: 5px; background: #0A0A0A"></span>
        <span style="flex: 1; font-size: 15px; font-weight: 700">Rings until done</span>
        <span style="font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums">8:00 PM</span>
      </div>
    </div>
  </section>

  <section style="display: flex; align-items: center; gap: 12px; background: #0A0A0A; color: #FFFFFF; border-radius: 20px; padding: 14px 16px">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v10M9 9.5h4.5a2 2 0 0 1 0 4H9"></path></svg>
    <span style="flex: 1; font-size: 14px; line-height: 20px">Earn <strong>+40 pts</strong> each day you prove it. Streaks add a bonus.</span>
  </section>

  <div style="flex: 1"></div>

  <button type="button" style="height: 60px; border: 0; border-radius: 30px; background: #0A0A0A; color: #FFFFFF; font-size: 17px; font-weight: 700">Set mission</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
